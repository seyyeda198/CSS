<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Contact Card</title>

    <style>
        h2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            color: rgb(185, 184, 243);
            text-align: center;
            padding: 15px;
        }
        .profile {
            position: relative;
            width: 800px;
            height:300px;
            margin:100px auto 20px;
            padding: 30px;
            border: 2px solid black;
            background-color: #cae8e5;
            overflow: auto;
            text-align: center;
        }
        .profile img {
            float: left;
            width:150px;
            height: 150px;
            margin-right: 30px;
            border-radius: 70%;
        }
        .contact {
            position: absolute;
            top: 30px;
            right: 20px;
            width: 200px;
            padding: 20px;
            border-left: 3px solid black;
            text-align: center;
        }
        .content {
            margin-right: 250px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

        <h2>Company Contact Card</h2>

    <div class="profile">

        <div class="content">
            <img src="PROFILE.jpg" alt="Employee Photo">

            <h3>Zarah</h3>
            <h3>Software Developer</h3>

            <p>
                Zarah is a software developer with experience in
                web development and application development. She works
                with the development team to create efficient and
                user-friendly applications.
            </p>
        </div>

        <div class="contact">
            <h3>Contact Info</h3>
            <p>Phone: 9876543210</p>
            <p>Email: zarahh@gmail.com</p>
        </div>

        <div class="clear"></div>

    </div>

</body>
</html>
