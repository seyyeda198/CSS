<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Card</title>
    <style>
        h2 {
            background-color: aqua;
            text-align:center;
            position:fixed;
            width:100%;
            top:0;
            left:0;
            padding:20px;
            margin:0;
            
        }
        .details {
            border:5px solid black;
            margin:auto;
            margin-top: 130px;
            width:900px;
            height:300px;
            position:relative;
            padding:30px;
            text-align:center;
            overflow:auto;
        }
        .contact {
            text-align:center;
            position:absolute;
            top:30px;
            right:20px;
            border-left:3px solid black;
        }
        img {
            float:left;
            margin-right:30px;
        }
        .clear {
            clear:both;
        }
    </style>
</head>
<body>
    <h2>COMPANY CONTACT CARD</h2>
    <div class="details">
       <img src="PROFILE.jpg" width="150" height="150">
        <h3>Zarah</h3>
        <h4>Software Developer</h4>
        <p>
            Zarah is a software developer with experience in
            web development and application development. She works
            with the development team to create efficient and
            user-friendly applications
        </p>
    <div class="contact">
            <h3>Contact Info</h3>
            <p>Phone: 9876543210</p>
            <p>Email: zarahh@gmail.com</p>
        </div>
        <div class="clear"></div>
        </div>


    
</body>
</html>
